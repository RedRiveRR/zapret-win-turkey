; RedRiveRR Zapret (macOS) — tpws stratejileri. Biçim: Ad=tpws argümanları
; Aşama 1 başlangıç adayları; kullanıcının Mac'inde sahada denenecek (docs/macos-saha-denemesi.md).
; Mac'te yalnız Linux'a özgü ayarlar yok: --mss, --oob ile --disorder birlikte.
; Saha (2026-10-28, Türk ISS): SNI'lı Client Hello'dan sonra RST geliyordu; yalnız TLS kaydı bölme (--tlsrec) aşıyor
; (--split-pos/--disorder/--mss aşamadı). --tlsrec=sniext+1 Discord güncelleyicisinin (Secure Transport, 179 bayt)
; ClientHello'sunda RST yedi; --tlsrec=midsld Chromium, güncelleyici, curl ve Roblox ClientHello'larının hepsinde geçti.
[tpws]
TLS kaydı orta alan adı=--tlsrec=midsld
TLS kaydı ad sonrası=--tlsrec=host+1
TLS kaydı SNI sonrası=--tlsrec=sniext+1
Bölme + sıra bozma=--split-pos=1,midsld --disorder=tls
Orta alan adında bölme=--split-pos=midsld
TLS kaydı bölme=--tlsrec=sniext --split-pos=1
OOB + bölme=--oob=tls --split-pos=1
