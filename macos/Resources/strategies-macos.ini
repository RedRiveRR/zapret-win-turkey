; RedRiveRR Zapret (macOS) — tpws stratejileri. Biçim: Ad=tpws argümanları
; Aşama 1 başlangıç adayları; kullanıcının Mac'inde sahada denenecek (docs/macos-saha-denemesi.md).
; Mac'te yalnız Linux'a özgü ayarlar yok: --mss, --oob ile --disorder birlikte.
[tpws]
Bölme + sıra bozma=--split-pos=1,midsld --disorder=tls
Orta alan adında bölme=--split-pos=midsld
TLS kaydı bölme=--tlsrec=sniext --split-pos=1
OOB + bölme=--oob=tls --split-pos=1
