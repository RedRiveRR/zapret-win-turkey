name: Denetim

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  au3:
    name: Au3Check + birim testleri
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: AutoIt önbelleği
        id: cache-autoit
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\autoit
          key: autoit-v3-${{ runner.os }}-1

      - name: Taşınabilir AutoIt indir
        if: steps.cache-autoit.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'autoit.zip'
          Invoke-WebRequest -Uri 'https://www.autoitscript.com/files/autoit3/autoit-v3.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'autoit-x')
          Move-Item (Join-Path $env:RUNNER_TEMP 'autoit-x\install') (Join-Path $env:RUNNER_TEMP 'autoit')

      - name: Denetim
        shell: pwsh
        env:
          AUTOIT_DIR: ${{ runner.temp }}\autoit
        run: ./scripts/check.ps1
