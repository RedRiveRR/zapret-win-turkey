name: macOS

on:
  workflow_dispatch:
  push:
    branches: [gelistirme]
    paths:
      - 'macos/**'
      - 'ui/**'
      - 'veri/**'
      - 'config/hostlist.txt'
      - 'lib/Version.au3'
      - '.github/workflows/macos.yml'

jobs:
  test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Swift sürümü
        run: swift --version
      - name: Birim testleri
        run: swift test
      - name: Go (go-pcap2socks kaynaktan derlenir)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: .app paketi (universal, ad-hoc imza, denetim)
        run: bash scripts/build-app.sh "$GITHUB_WORKSPACE/dist-macos"
      - name: Paketi yükle
        uses: actions/upload-artifact@v4
        with:
          name: RedRiveRR-Zapret-macOS-${{ github.sha }}
          path: dist-macos/*.zip
          retention-days: 30
