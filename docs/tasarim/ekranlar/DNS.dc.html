        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 600;">Sağlayıcının DNS'i</span><span style="font-size: 12px; color: {{c.muted}};">Otomatik ayar. Türk Telekom'da Discord engellenebilir.</span></span>

        <input type="radio" name="dns" checked style="width: 18px; height: 18px; accent-color: {{c.accent}}; margin: 0;">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 600;">Cloudflare (1.1.1.1)</span><span style="font-size: 12px; color: {{c.muted}};">Şu an kullanılıyor. Çoğu bağlantıda yeterli.</span></span>

  </nav>

<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["Açık","Koyu"],"default":"Açık"},"$preview":{"width":460,"height":660}}'>
class Component extends DCLogic {
renderVals() {
const acik = {logoBg:'#5B5BD6',bg:'#F2F4F7',surface:'#FFFFFF',surface2:'#E9EDF2',line:'#EDF0F4',text:'#1D2433',muted:'#677489',accent:'#5B5BD6',accentTint:'#ECECFC',accentText:'#4342B8',onAccent:'#FFFFFF',ok:'#2F9E6E',okTint:'#E3F4EC',okText:'#1C6E4A'};

return { c: (this.props.tema ?? 'Açık') === 'Koyu' ? koyu : acik };
}
}
